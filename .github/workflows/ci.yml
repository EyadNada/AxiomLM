name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify CLI Tools & Entry Points
        run: |
          axiom-train --help
          axiom-generate --help
          axiom-export --help

      - name: Run Core Test Suite (Architecture, Muon, Shards, Sampling, Export)
        run: |
          python tests/test_all.py

      - name: Run Hardware Kernel Test Suite (SIMD, Metal MSL, Triton)
        run: |
          python tests/test_kernels.py

      - name: End-to-End Micro Training & Export Smoke Test
        run: |
          python -c "
          import os, torch
          from axiomlm.train import train
          from axiomlm.engine import export_checkpoint_to_hf
          
          # Force CPU by disabling MPS detection to prevent runner OOM
          if hasattr(torch.backends, 'mps'):
              def _mock_is_available(): return False
              _mock_is_available.__wrapped__ = getattr(torch.backends.mps.is_available, '__wrapped__', None)
              torch.backends.mps.is_available = _mock_is_available
              
          # CPU uses B=2, T=1024 (B*T=2048), so we use total_batch_size=2048
          train(max_steps=2, total_batch_size=2048, eval_interval=10, sample_interval=10, save_interval=1, architecture='modern', optimizer_type='muon')
          
          # Verify safetensors export from checkpoint
          if os.path.exists('checkpoints/model_latest.pt'):
              export_checkpoint_to_hf('checkpoints/model_latest.pt', 'exports/ci_test_export', 'AxiomLM-CI-Test')
              assert os.path.exists('exports/ci_test_export/model.safetensors'), 'Exported model.safetensors missing'
              assert os.path.exists('exports/ci_test_export/config.json'), 'Exported config.json missing'
          "

