name: Cross-Platform CPU CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpu-validation:
    name: CPU & Portable Validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil pytest
          pip install -e .

      - name: Verify CLI Tools & Entry Points
        run: |
          axiom-train --help
          axiom-generate --help
          axiom-export --help

      - name: Run Core Architecture & Math Test Suite
        run: |
          pytest -v tests/test_all.py
          pytest -v tests/test_integration.py
          pytest -v tests/test_unit_edge_cases.py

      - name: Run Portable Quantization Packing & Math Tests
        run: |
          pytest -v tests/test_quantization_drift_and_perplexity.py -k "test_per_layer_quantization_snr_and_cosine_similarity"

      - name: Run End-to-End Micro Training & HuggingFace Export Test
        run: |
          python tests/test_system_e2e.py
          python tests/test_convergence.py
