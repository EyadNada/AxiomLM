name: Benchmark Artifact Generator

on:
  workflow_dispatch:
    inputs:
      prompt_tokens:
        description: "Prompt token count (P)"
        required: true
        default: "512"
      gen_tokens:
        description: "Generation token count (N)"
        required: true
        default: "128"
      repetitions:
        description: "Repetition count for confidence intervals"
        required: true
        default: "3"
  release:
    types: [ published ]

jobs:
  generate-benchmarks:
    name: Execute Full 1-Click Reproducibility Suite (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil
          pip install -e .

      - name: Compile Native Metal & ARM NEON Kernels
        run: |
          python axiomlm/kernels/build_kernels.py

      - name: Execute Full Reproducibility Harness (AxiomLM vs MLX vs llama.cpp)
        run: |
          PROMPT="${{ github.event.inputs.prompt_tokens || '512' }}"
          GEN="${{ github.event.inputs.gen_tokens || '128' }}"
          REPS="${{ github.event.inputs.repetitions || '3' }}"
          python benchmarks/reproduce_all.py --prompt "$PROMPT" --gen "$GEN" --repetitions "$REPS"

      - name: Publish Markdown Comparison Table to Step Summary
        run: |
          echo "## 🚀 AxiomLM MLSys / OSDI Empirical Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "benchmarks/results/latest_benchmark_run.json" ]; then
            python -c "
          import json
          from benchmarks.reproduce_all import generate_markdown_comparison_table
          with open('benchmarks/results/latest_benchmark_run.json') as f:
              data = json.load(f)
          print(generate_markdown_comparison_table(data['benchmarks']))
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Raw Telemetry & Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiomlm-benchmark-telemetry
          path: benchmarks/results/
