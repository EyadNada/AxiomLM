[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomlm"
version = "0.1.0"
description = "High-performance pretraining engine & modern architectural overhaul of GPT-2 (124M) in pure PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eyad Nada" }
]
keywords = [
    "transformer",
    "gpt-2",
    "llama-3",
    "deep-learning",
    "pytorch",
    "muon-optimizer",
    "rotary-embeddings",
    "grouped-query-attention",
    "swiglu",
    "rmsnorm",
    "kv-cache",
    "apple-silicon",
    "metal",
    "arm-neon",
    "triton"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "datasets>=2.14.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
notebook = [
    "jupyter>=1.0.0",
]

[project.scripts]
axiom-train = "brain.train_gpt2:main"
axiom-generate = "brain.generate:main"

[project.urls]
Homepage = "https://github.com/EyadNada/GPT-2.0-124M"
Repository = "https://github.com/EyadNada/GPT-2.0-124M"
Issues = "https://github.com/EyadNada/GPT-2.0-124M/issues"
