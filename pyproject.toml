[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomlm"
version = "0.1.0"
description = "A high-performance PyTorch library for modern autoregressive Transformer modeling, fused hardware kernels, and spectral matrix optimization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Eyad Nada" }
]
keywords = [
    "transformer",
    "gpt-2",
    "llama-3",
    "deep-learning",
    "pytorch",
    "muon-optimizer",
    "rotary-embeddings",
    "grouped-query-attention",
    "swiglu",
    "rmsnorm",
    "kv-cache",
    "apple-silicon",
    "metal",
    "arm-neon",
    "triton"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "datasets>=2.14.0",
    "matplotlib>=3.7.0",
    "gradio>=5.0.0,<6.0.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
notebook = [
    "jupyter>=1.0.0",
]

[project.scripts]
axiom-train = "axiomlm.train:main"
axiom-generate = "axiomlm.engine.inference:main"
axiom-export = "axiomlm.engine.export:main"

[project.urls]
Homepage = "https://github.com/EyadNada/AxiomLM"
Repository = "https://github.com/EyadNada/AxiomLM"
Issues = "https://github.com/EyadNada/AxiomLM/issues"

[tool.setuptools.packages.find]
include = ["axiomlm*", "brain*", "kernels*"]
